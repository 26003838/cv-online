<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | 26003838</title>
    <style>
        :root { --bg: #1a1a1a; --card: #2d2d2d; --text: #e0e0e0; --accent: #00d4ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px; }
        .container { max-width: 900px; margin: auto; }
        header { border-left: 5px solid var(--accent); padding-left: 20px; margin-bottom: 40px; }
        h1 { font-size: 3rem; margin: 0; color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .skill-tag { display: inline-block; background: var(--accent); color: #000; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; margin: 5px; }
        h2 { color: var(--accent); text-transform: uppercase; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Jorge González</h1>
            <p>Software Admin | Músico | Desarrollador en formación</p>
        </header>
        <div class="grid">
            <div class="card">
                <h2>Perfil</h2>
                <p>Estudiante de Universidad Galileo apasionado por la automatización y la implementación de sistemas ERP. Combinando la lógica del código con la creatividad de la música.</p>
            </div>
            <div class="card">
                <h2>Stack Técnico</h2>
                <div class="skill-tag">C / C++</div>
                <div class="skill-tag">PHP</div>
                <div class="skill-tag">Java</div>
                <div class="skill-tag">Git</div>
                <div class="skill-tag">Ubuntu Server</div>
            </div>
        </div>
    </div>
</body>
</html>
